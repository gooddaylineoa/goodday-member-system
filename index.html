<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goodday Member</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <div class="max-w-md mx-auto bg-white min-h-screen p-4 pt-10">

    <!-- หน้า Login -->
    <div id="login-view">
      <h2 class="text-xl font-bold text-pink-600 mb-4 text-center">เข้าสู่ระบบ</h2>
      <input id="login-email" type="email" placeholder="อีเมล" class="w-full border rounded-lg p-3 mb-3">
      <input id="login-pass" type="password" placeholder="รหัสผ่าน" class="w-full border rounded-lg p-3 mb-3">
      <p id="login-error" class="text-red-500 text-sm mb-3 hidden"></p>
      <button id="btn-login" class="w-full bg-pink-600 text-white py-3 rounded-lg font-bold">เข้าสู่ระบบ</button>
      <p class="text-center text-sm mt-4">
        ยังไม่มีบัญชี? <button id="go-register" class="text-pink-600 font-bold">สมัครสมาชิก</button>
      </p>
    </div>

    <!-- หน้า Register -->
    <div id="register-view" class="hidden">
      <h2 class="text-xl font-bold text-pink-600 mb-4 text-center">สมัครสมาชิก</h2>
      <input id="reg-name" type="text" placeholder="ชื่อ-นามสกุล" class="w-full border rounded-lg p-3 mb-3">
      <input id="reg-phone" type="tel" placeholder="เบอร์โทรศัพท์" class="w-full border rounded-lg p-3 mb-3">
      <input id="reg-email" type="email" placeholder="อีเมล" class="w-full border rounded-lg p-3 mb-3">
      <input id="reg-pass" type="password" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัว)" class="w-full border rounded-lg p-3 mb-3">
      <p id="reg-error" class="text-red-500 text-sm mb-3 hidden"></p>
      <button id="btn-register" class="w-full bg-pink-600 text-white py-3 rounded-lg font-bold">สมัครสมาชิก</button>
      <p class="text-center text-sm mt-4">
        มีบัญชีแล้ว? <button id="go-login" class="text-pink-600 font-bold">เข้าสู่ระบบ</button>
      </p>
    </div>

    <!-- หน้า Profile -->
    <div id="profile-view" class="hidden">
      <div class="bg-pink-600 text-white rounded-xl p-5 mb-6">
        <p class="text-sm opacity-80">Member ID</p>
        <h2 id="prof-memberid" class="text-2xl font-bold">-</h2>
        <h3 id="prof-name" class="text-lg mt-2">-</h3>
      </div>

      <div class="bg-gray-50 border rounded-xl p-4 mb-4">
        <p class="text-xs font-bold text-gray-500 mb-1">ที่อยู่จัดส่ง</p>
        <p id="prof-address" class="text-sm text-gray-700">ยังไม่ได้กรอกที่อยู่</p>
        <button id="go-edit-address" class="text-pink-600 text-sm font-bold mt-2">แก้ไขที่อยู่ →</button>
      </div>

      <button id="btn-logout" class="w-full bg-gray-200 text-gray-600 py-3 rounded-lg font-bold">ออกจากระบบ</button>
    </div>

    <!-- หน้าแก้ไขที่อยู่ -->
    <div id="edit-address-view" class="hidden">
      <h2 class="text-xl font-bold text-pink-600 mb-4 text-center">แก้ไขที่อยู่จัดส่ง</h2>
      <input id="addr-subdist" type="text" placeholder="ตำบล/แขวง" class="w-full border rounded-lg p-3 mb-3">
      <input id="addr-dist" type="text" placeholder="อำเภอ/เขต" class="w-full border rounded-lg p-3 mb-3">
      <select id="addr-prov" class="w-full border rounded-lg p-3 mb-3 bg-white">
        <option value="">-- เลือกจังหวัด --</option>
      </select>
      <input id="addr-zip" type="text" placeholder="รหัสไปรษณีย์" class="w-full border rounded-lg p-3 mb-3">
      <p id="addr-error" class="text-red-500 text-sm mb-3 hidden"></p>
      <button id="btn-save-address" class="w-full bg-pink-600 text-white py-3 rounded-lg font-bold mb-2">บันทึกที่อยู่</button>
      <button id="btn-cancel-address" class="w-full bg-gray-200 text-gray-600 py-3 rounded-lg font-bold">ยกเลิก</button>
    </div>

  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
